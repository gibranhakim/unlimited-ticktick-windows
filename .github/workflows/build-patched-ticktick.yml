name: Build and Release Patched TickTick

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Direct URL to your original TickTick.exe file"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Patched TickTick
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download TickTick Setup
        shell: pwsh
        run: |
          $appUrl = "${{ inputs.app_url }}".Trim().Trim('"')

          function Test-PortableExecutable([string]$Path) {
            if (-not (Test-Path $Path)) {
              return $false
            }

            $header = Get-Content -Path $Path -AsByteStream -ReadCount 2 -TotalCount 2
            return $header.Count -eq 2 -and $header[0] -eq 0x4D -and $header[1] -eq 0x5A
          }

          Write-Host "Downloading target file from $appUrl..."
          Invoke-WebRequest -Uri $appUrl -OutFile "TickTick.exe"

          if (-not (Test-PortableExecutable "TickTick.exe")) {
            Write-Warning "Downloaded file is not a Windows executable. Attempting to resolve a direct download URL..."
            Remove-Item -Path "TickTick.exe" -ErrorAction SilentlyContinue

            $response = Invoke-WebRequest -Uri $appUrl
            $candidateUris = @()

            foreach ($link in $response.Links) {
              if (-not [string]::IsNullOrWhiteSpace($link.href)) {
                $candidateUri = [Uri]::new([Uri]$appUrl, $link.href).AbsoluteUri
                if ($candidateUri -ne $appUrl) {
                  $candidateUris += $candidateUri
                }
              }
            }

            $downloadSucceeded = $false
            foreach ($candidateUri in ($candidateUris | Select-Object -Unique)) {
              try {
                Write-Host "Trying candidate download URL: $candidateUri"
                Invoke-WebRequest -Uri $candidateUri -OutFile "TickTick.exe"
                if (Test-PortableExecutable "TickTick.exe") {
                  $downloadSucceeded = $true
                  break
                }
              }
              catch {
                continue
              }
            }

            if (-not $downloadSucceeded) {
              throw "Unable to download a valid Windows executable from '$appUrl'. Please provide a direct file URL."
            }
          }

      - name: Run Patcher
        # We can just build and run directly via dotnet run
        run: dotnet run -- "TickTick.exe"

      - name: Prepare Release Package
        shell: pwsh
        run: |
          if (-not (Test-Path "TickTick_Patched.exe")) {
            Write-Error "Patching failed: TickTick_Patched.exe not generated."
            exit 1
          }
          Compress-Archive -Path "TickTick_Patched.exe" -DestinationPath "TickTick_Patched.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Patched TickTick (${{ github.run_number }})
          files: TickTick_Patched.zip
          draft: true

      - name: Output Release URL
        shell: pwsh
        run: |
          Write-Host "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
